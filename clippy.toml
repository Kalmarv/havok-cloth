allow-unwrap-in-tests = true
allow-expect-in-tests = true

# File, environment and process access. This library works on bytes the caller passes in and never touches files, the
# environment or processes; lib.rs denies these methods and types to keep it so.
disallowed-methods = [
    { path = "std::fs::read", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::read_to_string", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::read_dir", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::write", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::copy", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::rename", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::create_dir", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::create_dir_all", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::remove_file", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::remove_dir", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::remove_dir_all", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::metadata", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::symlink_metadata", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::canonicalize", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::exists", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::try_exists", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::is_file", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::is_dir", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::metadata", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::read_dir", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::canonicalize", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::absolute", reason = "reads the working directory: this library takes bytes, not paths" },
    { path = "std::env::var", reason = "hidden options: the caller passes them" },
    { path = "std::env::var_os", reason = "hidden options: the caller passes them" },
    { path = "std::env::vars", reason = "hidden options: the caller passes them" },
    { path = "std::env::current_dir", reason = "hidden options: the caller passes them" },
    { path = "std::process::Command::new", reason = "no processes in library code" },
    { path = "std::fs::exists", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::read_link", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::hard_link", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::set_permissions", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::soft_link", reason = "file access: this library takes bytes, not paths" },
    { path = "std::os::unix::fs::symlink", reason = "file access: this library takes bytes, not paths", allow-invalid = true },
    { path = "std::path::Path::read_link", reason = "file access: this library takes bytes, not paths" },
    { path = "std::path::Path::is_symlink", reason = "file access: this library takes bytes, not paths" },
    { path = "std::env::args", reason = "hidden options: the caller passes them" },
    { path = "std::env::args_os", reason = "hidden options: the caller passes them" },
    { path = "std::env::temp_dir", reason = "reads the environment (the temporary folder): this library takes bytes, not paths" },
    { path = "std::env::home_dir", reason = "hidden options: the caller passes them" },
    { path = "std::env::set_current_dir", reason = "hidden options: the caller passes them" },
    { path = "std::env::set_var", reason = "hidden options: the caller passes them" },
    { path = "std::env::remove_var", reason = "hidden options: the caller passes them" },
    { path = "std::env::vars_os", reason = "hidden options: the caller passes them" },
    { path = "std::process::exit", reason = "no processes in library code" },
    { path = "std::process::abort", reason = "no processes in library code" },
    { path = "std::io::stdin", reason = "hidden options: the caller passes them" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::OpenOptions", reason = "file access: this library takes bytes, not paths" },
    { path = "std::fs::DirBuilder", reason = "file access: this library takes bytes, not paths" },
    { path = "std::process::Command", reason = "no processes in library code" },
]
